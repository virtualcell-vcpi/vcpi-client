[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vcpi"
version = "0.1.0"
description = "Python client for the Virtual Cell Pharmacology Initiative (VCPI)"
readme = "README.md"
authors = [{ name = "Ginkgo Datapoints" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pyarrow>=14.0",
    "duckdb>=0.9.0",
    "httpx>=0.24.0",
    "keyring>=23.0",
    "tqdm>=4.60",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "respx>=0.20.0",
]

[project.urls]
Homepage = "https://thevirtualcell.com"
Repository = "https://github.com/virtualcell-vcpi/vcpi-client"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
markers = [
    "integration: hits the real API (requires TVC_TOKEN)",
]
